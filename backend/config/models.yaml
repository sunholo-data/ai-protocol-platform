    provider: anthropic
    tier: default
    residency: us
    fallbacks: [claude-haiku-4-5, gemini-flash-lite]   # v6.13.0: same-provider ladder first, cross-provider gemini LAST (eu-strict drops the us rungs)
    context_window: 200_000
    max_output_tokens: 64_000
    description: "Claude Sonnet 4.6 — best Claude speed/intelligence balance (Feb 2026)"

  claude-opus-4-7:
    api_name: "claude-opus-4-7"
    provider: anthropic
    tier: smart
    residency: us
    fallbacks: [claude-sonnet-5, claude-haiku-4-5, gemini-flash-lite]   # v6.13.0: same-provider ladder first, cross-provider gemini LAST (eu-strict drops the us rungs)
    context_window: 200_000
    max_output_tokens: 64_000
    description: "Claude Opus 4.7 — superseded by Opus 4.8 (kept for back-compat)"

  # Current Anthropic flagships (2026-07 refresh — Claude 5 family + Opus 4.8).
  claude-opus-4-8:
    api_name: "claude-opus-4-8"
    provider: anthropic
    tier: smart
    residency: us
    fallbacks: [claude-sonnet-5, claude-haiku-4-5, gemini-flash-lite]   # v6.13.0: same-provider ladder first, cross-provider gemini LAST (eu-strict drops the us rungs)
    context_window: 200_000
    max_output_tokens: 64_000
    description: "Claude Opus 4.8 — Anthropic flagship reasoner (current smart tier)"

  claude-sonnet-5:
    api_name: "claude-sonnet-5"
    provider: anthropic
    tier: default
    residency: us
    fallbacks: [claude-haiku-4-5, gemini-flash-lite]   # v6.13.0: same-provider ladder first, cross-provider gemini LAST (eu-strict drops the us rungs)
    context_window: 200_000
    max_output_tokens: 64_000
    description: "Claude Sonnet 5 — current Claude speed/intelligence balance"

  claude-fable-5:
    api_name: "claude-fable-5"
    provider: anthropic
    tier: smart
    residency: us
    fallbacks: [claude-sonnet-5, claude-haiku-4-5, gemini-flash-lite]   # v6.13.0: same-provider ladder first, cross-provider gemini LAST (eu-strict drops the us rungs)

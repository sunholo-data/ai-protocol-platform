<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <!--
      Served by /sw.js when a navigation fails. Deliberately self-contained — no
      JS bundle, no web fonts: each would be one more request that fails
      offline, and a broken offline page looks like our bug, not the network's.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; line-height: 1.5; background: #fff; color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e2e8f0; } .card { border-color: #1e293b; } }
      .card { max-width: 26rem; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; }
      h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1rem; }
      button {
        font: inherit; font-weight: 600; cursor: pointer; width: 100%; min-height: 44px;
        border: 0; border-radius: 8px; padding: .7rem 1.1rem; background: #0f172a; color: #fff;
      }
      @media (prefers-color-scheme: dark) { button { background: #e2e8f0; color: #0f172a; } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This device has lost its connection. Try again once you&rsquo;re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>

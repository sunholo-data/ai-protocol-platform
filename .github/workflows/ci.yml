name: CI

# Every tier — platform-source, this deployment, forks — uses `dev` as its
# default branch (platform-source's `main` was renamed 2026-09-14; until then
# this list had never matched it and upstream ran no CI at all).
on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test-fast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra lint

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Guard platform-owner sentinel (only admin/platform_seed may write it)
        # PLATFORM-GLOBAL-SKILLS risk mitigation: any call that creates a
        # skill with owner_id == PLATFORM_OWNER_UID outside the seed module
        # re-introduces the exact class of bug M5 had to clean up (duplicate
        # rows with colliding names under different owners). Keep writes
        # centralized so the one-way "only the deploy seeds platform skills"
        # invariant is enforceable.
        run: |
          set -e
          hits=$(grep -RnE 'owner_id\s*=\s*PLATFORM_OWNER_UID|owner_id\s*=\s*"aitana-platform"' \
            --include='*.py' \
            --exclude-dir='.venv' --exclude-dir='__pycache__' --exclude-dir='tests' \
            . \
            | grep -v 'admin/platform_seed.py' \
            | grep -v 'skills/platform.py' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Platform owner_id may only be set in backend/admin/platform_seed.py."
            echo "Offending lines:"
            echo "$hits"
            exit 1
          fi
          echo "Platform sentinel writes are confined to admin/platform_seed.py."

      - name: Test (fast only)
        # --ignore=tests/integration skips the folder at collection time.
        # Integration tests import app.py, which calls google.auth.default()
        # at module load — fine on Cloud Run / a dev laptop, fatal on a
        # GitHub runner with no ADC. The marker filter alone deselects
        # execution but still imports the test modules.
        # ADK_ARTIFACT_BUCKET is empty so tests use InMemoryArtifactService.
        env:
          ADK_ARTIFACT_BUCKET: ""
          # The startup project guard (v6.19.0 / AIPLA #42) refuses to boot with
          # no GCP project — correctly, since Firestore/GCS/ADK would target the
          # wrong place. A CI runner has no ADC, so it has no project, and the
          # guard fires at IMPORT time. conftest.py sets the same value, but as a
          # session fixture it runs AFTER collection and cannot help.
          #
          # Matches conftest's `fake_project` so both agree. This is why CI had
          # been red on dev since 2026-08-12: it passes on a laptop because ADC
          # resolves a project there, which is exactly the local/CI gap the
          # repo's own pre-push guidance warns about.
          GOOGLE_CLOUD_PROJECT: test-project
        run: uv run pytest tests/ --ignore=tests/integration -m "not slow" --tb=short -q

  cli:
    name: CLI (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Install dependencies
        run: uv sync --dev

      # `cd cli && make lint` was red on formatting for weeks before 2026-09-14
      # because nothing in CI ran it. Same gate as backend: check + format.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest tests/ --tb=short -q

  local-mode-safety:
    name: LOCAL_MODE safety (no leaks in deployed configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refuse local-mode truthy leaks in cloudbuild / tf / workflows
        run: python3 scripts/check_local_mode_safety.py
      # platform-source only (the tooling is itself withheld from the public
      # template, where this step is skipped): the published tree must not
      # import the private tier and must compile without it.
      - name: Publish check (public template is sound without private/)
        run: |
          if [ -f private/scripts/publish_public.py ]; then
            python3 private/scripts/publish_public.py check
          else
            echo "no private tier in this repo; nothing to check"
          fi

  user-guide:
    name: User guide pages (blocking)
    runs-on: ubuntu-latest
    # Broken images, empty alt text, a bold UI label that no longer exists in
    # the app (a renamed button), or a customer name on a shared page — each
    # ships a wrong /help page and a wrong platform-guide answer.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bundler + check tests
        run: node --test scripts/user-guide/*.test.mjs
      - name: Check the pages
        run: node scripts/user-guide/check.mjs

  docs-links:
    name: Docs links (report dangling)
    runs-on: ubuntu-latest
    # Reporting only. The repo carries a backlog of pre-existing dangling links;
    # blocking on the absolute count would red every build. The enforceable
    # contract is a ratchet — see backend/tests/unit/test_link_check.py, which
    # pins a ceiling so the number cannot climb.
    #
    # Unlike the parity job this one SHIPS: scripts/link-check.py is a general
    # docs tool, useful to any fork, and is not template-* scaffolding.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report dangling doc links
        run: ./scripts/link-check.py || true

  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: astral-sh/setup-uv@v3
      - name: Real backend stream through installed AG-UI client
        working-directory: backend
        run: |
          uv run --frozen --no-dev python scripts/capture_agui_wire.py > "$RUNNER_TEMP/agui-wire.jsonl"
          node ../frontend/scripts/check-agui-wire.mjs "$RUNNER_TEMP/agui-wire.jsonl"

      - name: Lint + typecheck
        run: npm run quality:check:fast

      - name: Test
        run: CI=true npm run test:run

  security-audit:
    name: Security audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Security tooling regression tests
        run: |
          node --test scripts/tests/security-floors.test.mjs
          python3 -m unittest discover -s scripts/tests -p 'test_reconcile_dependabot_alerts.py'
      - name: Audit locked runtime dependencies
        run: scripts/security-check.sh

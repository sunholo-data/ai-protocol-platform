  <!-- Optically centred on the disc. Two things to keep in mind if you retune it:
       (1) tracking lives on the <tspan dx>, NOT letter-spacing — letter-spacing
       also applies *after* the last glyph, and text-anchor="middle" centres the
       advance width including that trailing space, so it drags the ink right by
       half the tracking; (2) 256,256 is the geometric centre, and the -5 lifts
       the ink box (dot-of-the-i down to the baseline, no descenders) off the
       font's central baseline. Measured from rendered pixels, not eyeballed. -->
  <text x="258" y="251" text-anchor="middle" dominant-baseline="central"
    font-family="'Euclid Circular A', 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="250" font-weight="600" fill="#ffffff">a<tspan dx="-8">i</tspan></text>
</svg>

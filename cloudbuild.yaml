# Aitana Platform v6 -- Cloud Build configuration
# Branch-based deployment: main -> dev, test -> test, prod -> production
# Multi-container Cloud Run: frontend (main) + backend (sidecar)
#
# Substitutions are managed by Terraform (see infrastructure repo)

substitutions:
  _VERTEX_AI_SEARCH_DATASTORE_ID: ''
  _VERTEX_AI_SEARCH_PROJECT: ''
  _VERTEX_AI_SEARCH_LOCATION: 'eu'
  _A2A_AGENT_DOCUMENTS_BUCKET: ''
  # v6.39.0: off unless the env sets it. Real values live in the
  # trigger substitutions, per docs/ops/env-config-parity.md.
  _BROWSER_SERVICE_ENABLED: 'false'
  _BROWSER_SERVICE_URL: ''
  # v6.40.0 RESIDENT-P1 M11: the resident agent's base URL. Empty by default,
  # so `ask_assistant` refuses visibly ("no resident assistant is configured")
  # rather than half-working. Real value belongs in the TRIGGER substitutions
  # alongside _BROWSER_SERVICE_URL, per docs/ops/env-config-parity.md — it is
  # Terraform-managed and not set from here.
  _RESIDENT_AGENT_URL: ''
  # v6.40.0 M4: where to ask for a stopped resident agent to be started.
  # A stopped instance does NOT wake on a request — its URL 404s until
  # something calls :start — so without this an idle-stopped agent is simply
  # unreachable, and the user is told that plainly rather than shown a
  # transport error. The coordinator hosts it because the AILANG estate is
  # where the authority to operate those instances belongs (design P2).
  _RESIDENT_START_ENDPOINT: ''
  # v6.40.0 M12-M14: per-user resident instances. OFF by default, and an
  # EXPLICIT mode rather than "resolve a record if one happens to exist" — a
  # silent fallback from per-user to the shared instance is precisely how one
  # user's question ends up answered on another user's box (design D11).
  # Terraform-managed alongside the two above. Turning it ON means every
  # eligible user needs a `resident_agents` record: without one they are told
  # plainly that they have no assistant, which is the correct fail-closed
  # answer and NOT a fallback to the shared instance.
  _RESIDENT_AGENT_PER_USER: 'false'
  # v6.40.0 M7: show the asking user the story of their resident run —
  # the commands it ran and the files it touched — in the workbench,
  # instead of one line of prose after up to 180 seconds of nothing.
  # OFF by default and dev first: it puts peer-controlled text on a
  # surface, and the whole feature degrades to today's behaviour when
  # unset, so there is no reason to switch it on everywhere at once.
  _RESIDENT_SESSION_STORY_ENABLED: 'false'
  # v6.40.0 M5a: where the resident should POST a task update when it finishes,
  # so an answer that outlives its chat turn still reaches the user. This is
  # the deployment's OWN public origin — the FRONTEND service, because the
  # standalone backend is deployed --no-allow-unauthenticated and the instance
  # holds no credential for it, while the frontend is public and its
  # `/api/proxy/**` catch-all forwards Authorization untouched to the sidecar.
  # Terraform-managed alongside the three above.
  #
  # INCLUDE THE `/api/proxy` SUFFIX when this is a frontend origin. Verified
  # live 2026-09-04: POST <fe>/api/proxy/internal/tasks/recompact returns the
  # backend's JSON 403, while POST <fe>/internal/tasks/recompact returns a Next
  # 404 HTML page. Without it every webhook 404s and says so only in the
  # instance's log, where nobody is looking — the /start vs /instances/start
  # shape again (HANDOVER §3).
  #
  # EMPTY IS A WORKING STATE, not a broken one: no webhook is registered, and a
  # slow question is reported as slow instead of promising a delivery nothing
  # can make. That is what lets this code reach an env before its config does.
  _RESIDENT_PUSH_BASE_URL: ''
  # TEMPLATE-INVERT M4b: neutral default + a hard guard below. Deploying with
  # the wrong service name does not error — it creates a SECOND Cloud Run
  # service while the real one keeps serving, which is a silent split-brain.
  # The guard turns that into a failed build (CLAUDE.md #8: never silent).
  # `terraform_managed`, not a plausible service name: the deploy guard
  # below refuses this exact value, and TEST's real service IS called
  # `platform-frontend`. Guarding on a real name meant test could never
  # deploy — it only worked on dev, whose services are `platform-v6-*`.
  _SERVICE_NAME: terraform_managed
  # Opt-in for the first deploy of a NEW env; otherwise a missing service means
  # the substitution is wrong.
  _ALLOW_NEW_SERVICE: "false"
  # Prefix for Terraform-created per-deploy resources: the logs bucket, the
  # compaction queue and the tasks SA all share it. One substitution rather
  # than three literals, so a fork renames its resources in one place.
  # Unlike _SERVICE_NAME a wrong value here fails at RUNTIME (a missing bucket
  # or queue), not at deploy — so it is not guarded, just centralised.
  _RESOURCE_PREFIX: platform
  # BigQuery project holding the ENTSO-E ingestion the day-ahead-prices
  # tool reads. Deployment identity; empty means the tool is not
  # configured for this env and says so.
  _ENTSOE_PROJECT: ''
  _REGION: terraform_managed
  _BUILD_FOLDER: .
  _ARTIFACT_REGISTRY_REPO_URL_CLIENT: terraform_managed
  _PROJECT_ID: terraform_managed
  _FIREBASE_BUCKET: '${_PROJECT_ID}.firebasestorage.app'
  # Firebase helper image is built by v5's trigger-dev-firebase and tagged per-env
  # (dev/test/prod), not per-branch. v6 main -> dev; test/prod triggers override.
  _FIREBASE_TAG: dev
  # Admin seed allowlist — SA emails permitted to call
  # /api/admin/seed-platform-skills. Terraform-managed per env.
  _ADMIN_SEED_ALLOWED_SAS: terraform_managed
  # TEMPLATE-INVERT M3: operator email domains (csv) for the v6.18.0 Gap-B
  # domain gate. DEPLOYMENT IDENTITY — backend/auth/__init__.py no longer
  # defaults to ours, so this is the only supplier.
  #
  # !! Empty here on purpose (a fork must not inherit our domains), which means
  # every env running AUTH_REQUIRE_KNOWN_DOMAIN=1 MUST override it in its
  # trigger substitutions. Per traps.md #23 that is TWO places: run_client.tfvars
  # feeds the BRANCH trigger only, and the hand-maintained tag-release trigger
  # that deploys test has to be updated separately.
  #
  # If it is missed, the backend logs a loud AUTH_OPERATOR_DOMAINS_MISSING error
  # at startup rather than silently denying every operator.
  _AUTH_OPERATOR_DOMAINS: ""
  # MODEL-RELIABILITY M3: deployment residency gate (eu-strict|unrestricted),
  # enforced by construction in resolve_model_chain. dev = unrestricted (the
  # accepted dev/demo US-egress exception); set "eu-strict" per-trigger when
  # cutting test/prod — pre-promotion audit item alongside trap 20. models.yaml
  # ships default_policy: eu-strict, so an env that wires NOTHING fails safe.
  _MODEL_RESIDENCY_POLICY: "unrestricted"
  # 1e second-pass compaction (sidecar = the chat path that ENQUEUES). Default
  # OFF; dev opts in via run_client.tfvars trigger substitutions. See
  # backend/cloudbuild.yaml for the same block on the standalone service.
  _COMPACTION_SECOND_PASS: ""
  _COMPACTION_TASKS_TARGET_URL: ""
  # Memory Bank write path (backend/adk/memory_autosave.py). Recall tools are on
  # for every skill by default, so writing is on by default too: with recall on
  # and writing off, every turn searched a bank nothing was ever saved to
  # (found 2026-10-20 — no env had it set). "" or "0" turns it off per trigger.
  _MEMORY_AUTOSAVE: "1"
  # MODEL-RELIABILITY M1: gates GET /api/debug/slow-stream (auth-required
  # transport probe used by scripts/smoke-long-stream.sh). Default true is
  # safe while only the dev trigger exists — set "false" per-trigger when
  # cutting test/prod (deploy-skill trap 20 / pre-promotion audit item).
  _SLOW_STREAM_PROBE_ENABLED: "true"
  # Sprint 1.7 M4: separate-origin sandbox proxy URL for MCP App iframes.
  # Baked into the Next.js bundle at build time (NEXT_PUBLIC_*).
  # See _MCP_SANDBOX_URL below — moved to the fork-ergonomics block.
  # Cloud Build log bucket. Defaults to a project-local bucket so fresh
  # forks don't hit the Aitana-owned your-deploy-project-id-logging-bucket.
  # Run scripts/bootstrap-gcp-project.sh to create it before first deploy.
  # Terraform can override per env (docs/ops/gotchas.md #6).
  _LOG_BUCKET: 'gs://${_PROJECT_ID}-cloudbuild-logs'
  # Channel feature flags — set to 'true' to wire the Secret Manager secret
  # and activate the channel. Leave 'false' (default) and the secret need
  # not exist; the channel simply won't start (docs/ops/gotchas.md #5).
  _ENABLE_ANTHROPIC: 'true'
  # OpenAI (GPT-tier skills). ON by default — the OPENAI_API_KEY + OPENAI_API_BASE
  # secrets already exist in dev/test/prod Secret Manager (verified 2026-07-16);
  # this just mounts them onto the chat sidecar, which root cloudbuild never did
  # (only backend/cloudbuild.yaml, the standalone A2A backend, mounted them). A
  # FORK without those secrets must set this 'false' or its deploy fails mounting
  # a missing secret. Without it, GPT-pinned skills fall back down their
  # models.yaml ladder to gemini-flash-lite. See docs/ops/env-config-parity.md.
  _ENABLE_OPENAI: 'true'
  _ENABLE_TELEGRAM: 'false'
  _ENABLE_WHATSAPP: 'false'
  _ENABLE_EMAIL: 'false'
  # Platform skill owner email. Set to the admin email for this deployment.
  # Forks MUST override this — leaving it empty causes the backend to refuse
  # to start rather than silently using the Aitana fallback (item #3).
  _PLATFORM_OWNER_EMAIL: ''
  # MCP sandbox iframe URL — baked into the frontend build as
  # NEXT_PUBLIC_MCP_SANDBOX_URL (build-time; empty → the artefact iframe falls
  # back to http://localhost:3457, which is BLANK on a deployed env). This is
  # the Aitana DEV mcp-sandbox service URL; test/prod override it via their own
  # trigger substitution (each env has its own sandbox service), and forks set
  # their own. Leaving it '' disabled MCP Apps on deployed dev — the blank
  # obligation-analysis Workspace, 2026-07-12.
  _MCP_SANDBOX_URL: ''
  # TEMPLATE-INVERT M4b: the deployed A2A agent card's `url`. A live Cloud
  # Run URL, so it cannot be derived from _PROJECT_ID. Empty here; each env
  # supplies its own in trigger substitutions. Left empty, the card falls
  # back to localhost and the frontend proxy rewrites it (G43 part 2).
  _PUBLIC_BASE_URL: ''
  # Feature flag: expose the Skill Studio authoring UI (/skills/studio). "true"
  # bakes NEXT_PUBLIC_ENABLE_SKILL_STUDIO into the frontend build. Behind Firebase
  # auth; has known gaps (see docs/design/v6.9.0/skill-administration.md).
  _ENABLE_SKILL_STUDIO: 'true'
  # Experimental browser diagnostics and visual evidence require explicit opt-in.
  _WEBMCP_ENABLED: 'false'
  _VISUAL_EVIDENCE_ENABLED: 'false'
  # All gates must be explicitly populated for synthetic visual inspection.
  _VISUAL_EVIDENCE_ALLOWED_UIDS: ''
  _VISUAL_EVIDENCE_SYNTHETIC_SOURCE_DIGESTS: ''
  _VISUAL_EVIDENCE_SYNTHETIC_CAPTURE_PAIRS: ''
  _VISUAL_EVIDENCE_MODEL: ''
  _VISUAL_EVIDENCE_APPROVED_MODEL_REGIONS: ''
  # Feature flag: read-aloud (TTS) button on assistant messages. Was set in
  # frontend/.env.local ONLY, so it worked locally and was compiled OUT of every
  # deployed build — the backend served a valid voice config and /api/voice/config
  # reported enabled:true, but no button ever rendered (2026-08-05). Declared here
  # rather than left to the FIREBASE_ENV secret so it cannot drift per env.
  _ENABLE_READ_ALOUD: 'true'
  # FRONTEND-OBS M3: 'off' degrades the client logger to console-only.
  _CLIENT_LOGGING: 'on'
  # G17 (template-fork-ergonomics.md): include the 7-skill workshop demo
  # bundle (code-assistant, data-extractor, document-analyst,
  # general-assistant, web-researcher, workspace-demo, workspace-demo-interactive)?
  # Default `true` here because the platform repo's own deploys depend on
  # those skills (workshop + dev fixtures). The sanitize-for-template
  # pipeline flips this to `false` for the public template so a freshly
  # forked clean-slate deploy doesn't ship with seven inherited skills
  # the fork author never asked for.
  _INCLUDE_DEMO_SKILLS: 'true'
  # AIPLA #36: emergency CI-gate bypass. Only settable on a MANUAL
  # `gcloud builds triggers run --substitutions=_SKIP_CI_GATE=1` — a branch
  # push cannot pass substitutions, so the gate is un-bypassable on the
  # normal deploy path. Structurally enforced by
  # backend/tests/unit/test_cloudbuild_ci_gate.py.
  _SKIP_CI_GATE: ''

tags: ['${_PROJECT_ID}', '${_SERVICE_NAME}']

options:
  logging: GCS_ONLY
logsBucket: '${_LOG_BUCKET}'

steps:
  # --- CI gate (v6.19.0, AIPLA #36) -----------------------------------------
  # The branch-push deploy trigger and GitHub Actions CI are independent
  # systems: a push fires BOTH in parallel with nothing linking them, so a
  # commit whose CI is red deploys anyway. That is not hypothetical — a
  # ruff-format failure shipped to dev on 2026-06-17, and the same day's
  # hotfix would have deployed with red tests too.
  #
  # These two steps run the SAME checks as .github/workflows/ci.yml, before
  # anything is built, and every downstream step waits on both. Deliberately
  # scoped to CORRECTNESS (lint/format/tests) — dependency CVEs are governed
  # separately (PR merge-block + weekly cron) and must not block a dev deploy.
  #
  # `_SKIP_CI_GATE` is an emergency hatch that only works on a MANUAL
  # `gcloud builds triggers run --substitutions=_SKIP_CI_GATE=1`; a branch push
  # cannot set substitutions, so the gate is un-bypassable on the normal path.
  - name: 'python:3.12-slim'
    waitFor: ['-']
    id: 'ci-gate-backend'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_SKIP_CI_GATE}" = "1" ]; then
          echo "CI GATE SKIPPED (manual override _SKIP_CI_GATE=1)"; exit 0
        fi
        pip install --quiet uv
        cd backend
        uv sync --dev --extra lint --quiet
        echo "--- ruff check ---"        && uv run ruff check .
        echo "--- ruff format check ---" && uv run ruff format --check .
        echo "--- pytest (fast) ---"     && uv run pytest tests/ --ignore=tests/integration -m "not slow" --tb=short -q

  - name: 'node:20-slim'
    waitFor: ['-']
    id: 'ci-gate-frontend'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_SKIP_CI_GATE}" = "1" ]; then
          echo "CI GATE SKIPPED (manual override _SKIP_CI_GATE=1)"; exit 0
        fi
        cd frontend
        npm ci --silent
        echo "--- lint + typecheck ---" && npm run quality:check:fast
        echo "--- vitest ---"           && CI=true npm run test:run

  # --- Firebase rules ---
  - name: '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/sunholo-llmops/firebase:${_FIREBASE_TAG}'
    waitFor: ['ci-gate-backend', 'ci-gate-frontend']
    id: 'deploy-firebase-rules'
    entrypoint: bash
    args:
      - '-c'
      - |
        firebase &&
        firebase -P ${_PROJECT_ID} --json deploy --only firestore:rules,firestore:indexes --force

  # --- Get Firebase config from Secret Manager ---
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-firebase-config'
    waitFor: ['ci-gate-backend', 'ci-gate-frontend']
    entrypoint: 'bash'
    args:
      - './get-firebase-config.sh'
    env:
      - '_PROJECT_ID=$_PROJECT_ID'

  # --- Build frontend ---
  # docker_args contains `--build-arg KEY` (no values). We populate the env
  # from .env.local here so Docker can resolve each --build-arg KEY against
  # the build environment. Cannot use `source .env.local` — that runs the
  # values through the shell parser and chokes on unquoted spaces /
  # ampersands (e.g. NEXT_PUBLIC_BRAND_APP_NAME=Acme Energy parses as
  # `KEY=Our` then runs `New Energy` as a command). The while-read loop
  # splits on the first `=` only and treats the rest as literal — safe for
  # arbitrary values including spaces, `&`, `=`, quotes, etc.
  # See get-firebase-config.sh for the matching producer change.
  # --- User guide → both build contexts ---
  # frontend/ and backend/ each build from their own folder, so neither can read
  # docs/user-guide. Merge platform pages + any docs/customers/*/user-guide
  # overlay into frontend/content, frontend/public/help/img and backend/bundled
  # (gitignored build outputs). A bad page (missing image, unknown anchor) fails
  # the build here rather than shipping a broken /help.
  - name: 'node:20-slim'
    id: bundle-user-guide
    waitFor: ['ci-gate-backend', 'ci-gate-frontend']
    entrypoint: 'node'
    args: ['scripts/user-guide/bundle.mjs']

  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    waitFor: ['get-firebase-config', 'bundle-user-guide']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        while IFS='=' read -r key val; do
          [[ -z "$$key" || "$${key:0:1}" == "#" ]] && continue
          export "$$key=$$val"
        done < .env.local
        ARGS=$$(cat /workspace/docker_args)
        docker build $$ARGS \
          --build-arg NEXT_PUBLIC_MCP_SANDBOX_URL=${_MCP_SANDBOX_URL} \
          --build-arg NEXT_PUBLIC_ENABLE_SKILL_STUDIO=${_ENABLE_SKILL_STUDIO} \
          --build-arg NEXT_PUBLIC_WORKSPACE_DEFAULT_RATIOS \
          --build-arg NEXT_PUBLIC_WEBMCP_ENABLED=${_WEBMCP_ENABLED} \
          --build-arg NEXT_PUBLIC_VISUAL_EVIDENCE_ENABLED=${_VISUAL_EVIDENCE_ENABLED} \
          --build-arg NEXT_PUBLIC_ENABLE_READ_ALOUD=${_ENABLE_READ_ALOUD} \
          --build-arg NEXT_PUBLIC_CLIENT_LOGGING=${_CLIENT_LOGGING} \
          -t ${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/ui:${SHORT_SHA} \
          -f frontend/Dockerfile \
          frontend/

  # --- Build backend ---
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    waitFor: ['ci-gate-backend', 'ci-gate-frontend', 'bundle-user-guide']
    dir: ${_BUILD_FOLDER}/backend
    args:
      - 'build'
      - '--build-arg'
      - 'FIREBASE_BUCKET=${_FIREBASE_BUCKET}'
      - '--build-arg'
      - 'GOOGLE_CLOUD_PROJECT=${_PROJECT_ID}'
      - '--build-arg'
      - 'GOOGLE_CLOUD_LOCATION=${_REGION}'
      # The image carries its own version (build-once: promote copies the image,
      # so a deploy-time env var would be wrong by construction). Error Reporting
      # groups browser errors by serviceContext.version; without this every env
      # reported "dev" and releases could not be told apart. SHORT_SHA only: a
      # build step may not reference TAG_NAME (empty on a branch build — see
      # test_cloudbuild_image_identity.py), and a tag resolves to its commit.
      - '--build-arg'
      - 'COMMIT_SHA=${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/backend:${SHORT_SHA}'
      - '.'

  # --- Build MCP Toolbox (v6.14.0 database-gateway sidecar) ---
  # Wraps Google's pinned upstream image (FROM …/toolbox:1.7.0) and bakes in our
  # curated tools.yaml. Runs as a THIRD container in this service, loopback-only.
  # Design: docs/design/v6.14.0/mcp-toolbox-database-gateway.md
  # TEMPLATE-INVERT M3: tools.yaml is GENERATED from the tracked
  # tools.example.yaml and gitignored, so Cloud Build's clone does NOT contain
  # it and `COPY tools.yaml` would fail. Materialize it first.
  #
  # Deployment-specific tool definitions belong in this env's own source, not in
  # a file tracked identically upstream and downstream — that was the
  # permanent-conflict case. Until this env supplies its own, the example
  # toolset is what deploys.
  - name: 'gcr.io/cloud-builders/git'
    id: materialize-toolbox-config
    # Waits on both CI gates like every other step (v6.19.0 / AIPLA #36): a
    # commit with red CI must not reach any build stage. Caught by
    # test_cloudbuild_ci_gate.py when this first shipped with waitFor: ['-'].
    waitFor: ['ci-gate-backend', 'ci-gate-frontend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        bash scripts/materialize-config.sh
        test -f infrastructure/mcp-toolbox/tools.yaml

  - name: 'gcr.io/cloud-builders/docker'
    id: build-toolbox
    waitFor: ['ci-gate-backend', 'ci-gate-frontend', 'materialize-toolbox-config']
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/toolbox:${SHORT_SHA}'
      - '-f'
      - 'infrastructure/mcp-toolbox/Dockerfile'
      - 'infrastructure/mcp-toolbox/'

  # --- Push images ---
  # Each push writes /workspace/image_<kind> — the image's DIGEST reference,
  # which the deploy step below consumes (v6.20.0, AIPLA #47).
  #
  #   * `:${BRANCH_NAME}` is still pushed. Nothing may break that reads it.
  #   * `:${SHORT_SHA}` is the immutable identity — present on branch AND tag
  #     builds, which is why the digest is resolved from it. It is populated for
  #     TRIGGERED builds; a hand-run `gcloud builds submit` would leave it empty
  #     and fail at `docker build` with "invalid reference format" — loud, and
  #     before anything deploys. (We run no `builds submit`; see docs/ops/gotchas.md.)
  #   * `:${TAG_NAME}` is pushed only on a tag build. It is EMPTY on branch
  #     builds, so it MUST stay behind the -n guard: unguarded it renders as
  #     `image:` and fails with "invalid reference format", which does not
  #     mention the substitution that caused it.
  #
  # Digest resolution FAILS THE BUILD when empty rather than falling back to
  # the tag: a silent fallback would restore the old behaviour exactly when
  # something is already wrong.
  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    waitFor: ['build-frontend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        REPO="${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/ui"
        docker push "$${REPO}:${SHORT_SHA}"
        if [ -n "${BRANCH_NAME}" ]; then
          docker tag "$${REPO}:${SHORT_SHA}" "$${REPO}:${BRANCH_NAME}"
          docker push "$${REPO}:${BRANCH_NAME}"
        fi
        if [ -n "${TAG_NAME}" ]; then
          docker tag "$${REPO}:${SHORT_SHA}" "$${REPO}:${TAG_NAME}"
          docker push "$${REPO}:${TAG_NAME}"
        fi
        DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "$${REPO}:${SHORT_SHA}" || true)
        if [ -z "$${DIGEST}" ]; then
          echo "FATAL: could not resolve digest for $${REPO}" >&2
          exit 1
        fi
        echo "$${DIGEST}" > /workspace/image_ui
        echo "ui -> $${DIGEST}"

  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    waitFor: ['build-backend']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        REPO="${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/backend"
        docker push "$${REPO}:${SHORT_SHA}"
        if [ -n "${BRANCH_NAME}" ]; then
          docker tag "$${REPO}:${SHORT_SHA}" "$${REPO}:${BRANCH_NAME}"
          docker push "$${REPO}:${BRANCH_NAME}"
        fi
        if [ -n "${TAG_NAME}" ]; then
          docker tag "$${REPO}:${SHORT_SHA}" "$${REPO}:${TAG_NAME}"
          docker push "$${REPO}:${TAG_NAME}"
        fi
        DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "$${REPO}:${SHORT_SHA}" || true)
        if [ -z "$${DIGEST}" ]; then
          echo "FATAL: could not resolve digest for $${REPO}" >&2
          exit 1
        fi
        echo "$${DIGEST}" > /workspace/image_backend
        echo "backend -> $${DIGEST}"

  - name: 'gcr.io/cloud-builders/docker'
    id: push-toolbox
    waitFor: ['build-toolbox']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        REPO="${_ARTIFACT_REGISTRY_REPO_URL_CLIENT}/${_SERVICE_NAME}/toolbox"
        docker push "$${REPO}:${SHORT_SHA}"
        if [ -n "${BRANCH_NAME}" ]; then
          docker tag "$${REPO}:${SHORT_SHA}" "$${REPO}:${BRANCH_NAME}"
          docker push "$${REPO}:${BRANCH_NAME}"
        fi
        if [ -n "${TAG_NAME}" ]; then
          docker tag "$${REPO}:${SHORT_SHA}" "$${REPO}:${TAG_NAME}"
          docker push "$${REPO}:${TAG_NAME}"
        fi
        DIGEST=$$(docker inspect --format='{{index .RepoDigests 0}}' "$${REPO}:${SHORT_SHA}" || true)
        if [ -z "$${DIGEST}" ]; then
          echo "FATAL: could not resolve digest for $${REPO}" >&2
          exit 1
        fi
        echo "$${DIGEST}" > /workspace/image_toolbox
        echo "toolbox -> $${DIGEST}"

  # --- Deploy to Cloud Run (multi-container) ---
  # Uses bash so channel secrets can be conditionally included based on
  # _ENABLE_* substitution flags (see docs/ops/gotchas.md #5).
  # v6.14.0 MCP Toolbox sidecar (database gateway). THIRD container.
  #   * --address=0.0.0.0 — REQUIRED, not a leak. Cloud Run's startup probe
  #     connects from outside the container's loopback, so a 127.0.0.1 bind
  #     makes the tcp probe DEADLINE_EXCEEDED and the revision never goes
  #     Ready (this bit us on the first deploy). The isolation is NOT the
  #     bind address: Cloud Run routes external ingress ONLY to the main
  #     container's port (8080), never to a sidecar's port, whatever it
  #     binds. So 0.0.0.0 is reachable by the backend (localhost) + the
  #     health prober, but NOT from the internet. The backend sidecar binds
  #     0.0.0.0:1956 for exactly this reason. Backend reaches toolbox at
  #     http://127.0.0.1:5000/mcp/<toolset>.
  #   * tcpSocket startup probe — Toolbox has NO /healthz (upstream #2644)
  #     and the image is distroless (no shell for an exec probe). Same form
  #     the backend sidecar uses on :1956.
  #   * No secrets, no auth: it runs as this service's runtime SA,
  #     which already holds bigquery.dataViewer on the tenant's project. tools.yaml
  #     is baked into the image (git-tracked, PR-reviewed) — no mount.
  #   * TOOLBOX_BQ_PROJECT — BigQuery BILLING/job project, per env.
  #     Full rationale in the YAML comment above this step.
  #   * RISK: a failing third container can take this PUBLIC frontend
  #     service Ready:False. Health-gating bounds it — a non-Ready revision
  #     gets no traffic, the old revision keeps serving (verified: the
  #     127.0.0.1 misconfig failed safely with zero downtime). Recovery in
  #     the deploy skill's trap catalogue.
  #
  # MODEL-RELIABILITY M1: --timeout=3600 (Cloud Run max) — without it
  # the default request timeout kills long SSE streams (the v5 long-stream
  # incident: a healthy 5-minute Anthropic response died mid-stream).
  # Pairs with the node:http proxy path in the frontend and the AG-UI
  # heartbeats in the backend. Carry this flag when cutting test/prod
  # envs — see the deploy skill's trap catalogue.
  #
  # G18 (template-fork-ergonomics.md): `^|^` delimiter override on
  # ADMIN_SEED_ALLOWED_SAS above — its value is a comma-separated list
  # of SA emails, and gcloud's default `--set-env-vars=` parser treats
  # comma as KEY=VAL separator. Without `^|^` the second SA silently
  # becomes a phantom env var with a malformed value; deploy "succeeds"
  # and the seeder rejects every legit caller. See `gcloud topic escaping`.
  # Rule for ALL future env-var additions: use `^|^` for any value
  # that could contain a comma. Single values are safe.
  #
  # G45-PARSE-FIX (2026-06-08): the comment block USED to live between
  # OTEL_... and ADMIN_SEED above with `#` lines breaking the `\` line
  # continuation. Bash treated every --set-env-vars AFTER the comment
  # as a separate command (`command not found`), silently dropping
  # ADMIN_SEED + PLATFORM_OWNER + _INCLUDE_DEMO_SKILLS + RAG_DOCUMENTS
  # + the G45 A2A vars from the deploy. New A2A vars exposed the bug
  # because they're load-bearing (G45 invocation 404'd until env vars
  # actually landed). Moved comment to AFTER the gcloud command so it
  # can't break continuation. NEVER add `# comment` lines between
  # `\`-continued lines of a shell command in cloudbuild.yaml.

  # TOOLBOX_BQ_PROJECT (v6.23.0) — the BigQuery BILLING/job project for the
  # toolbox sidecar. Set here rather than baked into tools.yaml because that file
  # lives INSIDE the image and v6.20.0 promotion COPIES the image to test/prod by
  # digest, so a build-time value cannot differ per env: before this, every env
  # billed BigQuery jobs to (and consumed the query quota of) the dev project.
  # Runtime env is the only mechanism that survives promotion.
  #
  # tools.yaml carries a colon-DEFAULT, so an env that never receives this var
  # degrades to the old dev behaviour rather than failing to boot — a Toolbox
  # parse error fails the sidecar startup probe and takes this PUBLIC service
  # Ready:False. Promotion sets no env vars by design (cloudbuild.promote.yaml
  # only swaps images), so a service first created by promotion alone inherits
  # the default until a branch deploy or Terraform sets it. Tracked in
  # docs/ops/env-config-parity.md.
  #
  # NOTE: keep prose OUT of the inline script below — Cloud Build caps a single
  # step arg at 10,000 chars and that script is already at ~9.6K. Adding a
  # dozen comment lines there failed the build at VALIDATION time
  # ("invalid .steps field: build step 10 arg 1 too long"), before any step ran.
  #
  # ENV_TIER (relocated out of the inline script 2026-09-01 to buy
  # headroom under Cloud Build's 10,000-char step-arg cap; the rationale
  # is unchanged):
  #
  # v6.15.0: ai_search cites gs:// sources in the PROD-indexed llmops bucket.
  # Remap them to THIS env's llmops bucket (docs duplicated at identical
  # paths) so open/preview reads a same-project bucket. dev/test remap to
  # their own bucket; prod reads the real prod bucket directly → no override.
  # Keyed on _PROJECT_ID, NOT BRANCH_NAME: BRANCH_NAME is EMPTY on a tag
  # build, so every one of these case statements fell through to `*)` and
  # silently deployed an env with the wrong settings. _PROJECT_ID is
  # terraform-managed per trigger and correct for branch, tag and manual
  # runs alike. (v6.20.0 — caught when the first tag build ran.)
  # TEMPLATE-INVERT M4b: the env tier is derived from the project id's
  # SUFFIX, not from a list of project names. Same behaviour, but the
  # pipeline no longer contains this deployment's identity — a fork's
  # `<anything>-dev` resolves exactly the same way ours does, with no new
  # trigger substitution to wire in two places (traps.md #23).
  #
  # The codebase already derives env this way (`_env_from_project`), so
  # this makes the pipeline agree with the app instead of restating it.
  #
  # A2A_INVOCATION_REQUIRE_AUTH (2026-09-01) — the inline `case` below keys this
  # on ENV_TIER so prod gets `true`. It was hardcoded `false` for EVERY env,
  # while the code default is `true` and backend/protocols/a2a_invocation.py is
  # explicit that "Production should always leave it true"; `false` exists only
  # so a dev env can integrate with the Gemini Enterprise auth modes that inject
  # service identity differently (docs/design/template/
  # template-a2a-invocation-bridge.md says "set false in dev"). The effect was
  # that an anonymous POST /a2a reached the JSON-RPC dispatcher on a public
  # production URL — verified against prod, which answered -32601 "Method not
  # found" instead of the 401 JSON-RPC envelope. Caught during the test -> prod
  # readiness audit, before assistant.example.com was repointed at v6.
  #
  # ALWAYS-REQUIRED SIDECAR SECRETS (ADK agent engine) — the `SECRETS=` line
  # below. Prose lives out here because a comment INSIDE the `- |` script
  # counts toward Cloud Build's 10,000-character per-arg limit, which fails
  # validation before any step runs (guarded by
  # backend/tests/unit/test_cloudbuild_ci_gate.py).
  #
  # MAPS_GROUNDING_API_KEY is consumed indirectly: the
  # mcp_servers/maps-grounding-lite registry row carries the header value
  # "${MAPS_GROUNDING_API_KEY}" and tools/mcp/registry.py resolves it from the
  # environment. Written with a single $ here because a YAML comment never
  # reaches the build config; INSIDE the script it must be escaped `$$`, as the
  # dollar-brace form is parsed as a substitution key even in a shell comment
  # and an unescaped one fails the whole config with "not a valid built-in
  # substitution".
  #
  # Unconditional (no _ENABLE_ flag) because every env has the secret: dev/test
  # hold real keys, prod holds the "dummy_value" placeholder, so the mount
  # never fails on a missing secret.
  #
  # The mount is on the SIDECAR, and that is the whole point. The maps-assistant
  # skill 500'd on dev (2026-08-12) with the secret mounted only in
  # backend/cloudbuild.yaml — that file deploys the standalone IAM-protected
  # backend, but chat is served by THIS multi-container frontend's backend
  # sidecar. Both need it; a secret added to one is not added to the other.
  # The spec itself lives in scripts/deploy-run-service.sh — ONE definition,
  # called by this pipeline and by cloudbuild.promote.yaml. Read that file's
  # header for why; the short version is that promotion used to be images-only
  # to avoid duplicating this surface, which left prod's spec with no deploy
  # route at all. Every substitution below is forwarded under its own name.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: bash
    waitFor: ['push-frontend', 'push-backend', 'push-toolbox']
    env:
      - '_PROJECT_ID=${_PROJECT_ID}'
      - '_REGION=${_REGION}'
      - '_SERVICE_NAME=${_SERVICE_NAME}'
      - '_RESOURCE_PREFIX=${_RESOURCE_PREFIX}'
      - '_ENABLE_ANTHROPIC=${_ENABLE_ANTHROPIC}'
      - '_ENABLE_OPENAI=${_ENABLE_OPENAI}'
      - '_ENABLE_TELEGRAM=${_ENABLE_TELEGRAM}'
      - '_ENABLE_WHATSAPP=${_ENABLE_WHATSAPP}'
      - '_ENABLE_EMAIL=${_ENABLE_EMAIL}'
      - '_ALLOW_NEW_SERVICE=${_ALLOW_NEW_SERVICE}'
      - '_ADMIN_SEED_ALLOWED_SAS=${_ADMIN_SEED_ALLOWED_SAS}'
      - '_PLATFORM_OWNER_EMAIL=${_PLATFORM_OWNER_EMAIL}'
      - '_AUTH_OPERATOR_DOMAINS=${_AUTH_OPERATOR_DOMAINS}'
      - '_INCLUDE_DEMO_SKILLS=${_INCLUDE_DEMO_SKILLS}'
      - '_ENTSOE_PROJECT=${_ENTSOE_PROJECT}'
      - '_VERTEX_AI_SEARCH_DATASTORE_ID=${_VERTEX_AI_SEARCH_DATASTORE_ID}'
      - '_VERTEX_AI_SEARCH_PROJECT=${_VERTEX_AI_SEARCH_PROJECT}'
      - '_VERTEX_AI_SEARCH_LOCATION=${_VERTEX_AI_SEARCH_LOCATION}'
      - '_A2A_AGENT_DOCUMENTS_BUCKET=${_A2A_AGENT_DOCUMENTS_BUCKET}'
      - '_MODEL_RESIDENCY_POLICY=${_MODEL_RESIDENCY_POLICY}'
      - '_SLOW_STREAM_PROBE_ENABLED=${_SLOW_STREAM_PROBE_ENABLED}'
      - '_COMPACTION_SECOND_PASS=${_COMPACTION_SECOND_PASS}'
      - '_COMPACTION_TASKS_TARGET_URL=${_COMPACTION_TASKS_TARGET_URL}'
      - '_MEMORY_AUTOSAVE=${_MEMORY_AUTOSAVE}'
      - '_BROWSER_SERVICE_ENABLED=${_BROWSER_SERVICE_ENABLED}'
      - '_BROWSER_SERVICE_URL=${_BROWSER_SERVICE_URL}'
      - '_VISUAL_EVIDENCE_ENABLED=${_VISUAL_EVIDENCE_ENABLED}'
      - '_VISUAL_EVIDENCE_ALLOWED_UIDS=${_VISUAL_EVIDENCE_ALLOWED_UIDS}'
      - '_VISUAL_EVIDENCE_SYNTHETIC_SOURCE_DIGESTS=${_VISUAL_EVIDENCE_SYNTHETIC_SOURCE_DIGESTS}'
      - '_VISUAL_EVIDENCE_SYNTHETIC_CAPTURE_PAIRS=${_VISUAL_EVIDENCE_SYNTHETIC_CAPTURE_PAIRS}'
      - '_VISUAL_EVIDENCE_MODEL=${_VISUAL_EVIDENCE_MODEL}'
      - '_VISUAL_EVIDENCE_APPROVED_MODEL_REGIONS=${_VISUAL_EVIDENCE_APPROVED_MODEL_REGIONS}'
      - '_RESIDENT_AGENT_URL=${_RESIDENT_AGENT_URL}'
      - '_RESIDENT_START_ENDPOINT=${_RESIDENT_START_ENDPOINT}'
      - '_RESIDENT_AGENT_PER_USER=${_RESIDENT_AGENT_PER_USER}'
      - '_RESIDENT_SESSION_STORY_ENABLED=${_RESIDENT_SESSION_STORY_ENABLED}'
      - '_RESIDENT_PUSH_BASE_URL=${_RESIDENT_PUSH_BASE_URL}'
      - '_PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}'
    args: ['scripts/deploy-run-service.sh']

  # --- Post-deploy smoke: fail the build if any critical endpoint is not 200 ---
  # Per CLAUDE.md: no feature lands with manual-only verification. This step
  # protects against sidecar-silently-not-running bugs like FE-BRINGUP-1
  # (see docs/ops/deployed-urls.md for background).
  #
  # Cold-start handling (2026-06-11): post-deploy traffic hits a freshly
  # rolled-out Cloud Run revision that may need ~10-30s to load the Next.js
  # server + initialise the sidecar. The single-shot --max-time 20 was
  # flagging healthy deploys as FAILURE just because the first / hit
  # before the container was warm. Strategy now:
  #   1. Warm-up loop: poll `/` until 200 or 90s, no fail on individual
  #      misses. This pays the cold-start tax outside the assertion path.
  #   2. Per-request timeout bumped from 20s to 60s so a sluggish
  #      first-token-ish endpoint doesn't false-trip the assertion.
  #   3. One retry per assertion on a 0/5xx — collapses to PASS on the
  #      common case of a transient cold-start hiccup mid-smoke.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: smoke-deployed
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        echo "Smoking $${URL}"

        # Warm-up: hit `/` until it returns 200 or 90s elapses. Bail on
        # warm-up if even that fails — something more than cold-start is wrong.
        echo "Warming up (max 90s)..."
        deadline=$(($${SECONDS} + 90))
        while [ $${SECONDS} -lt $${deadline} ]; do
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$${URL}/") || code=000
          if [ "$${code}" = "200" ]; then
            echo "  warm after $${SECONDS}s"
            break
          fi
          sleep 3
        done
        if [ "$${code}" != "200" ]; then
          echo "FAIL warm-up never reached 200 (last code=$${code})"
          exit 1
        fi

        # One-retry helper. probe <path> <expected-code> [auth-token]
        probe() {
          local path="$1" expect="$2" header="$3"
          local code
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 \
              ${header:+-H "$${header}"} "$${URL}$${path}") || code=000
            if [ "$${code}" = "$${expect}" ]; then
              echo "OK   $${path} -> $${code}"
              return 0
            fi
            if [ "$${attempt}" = "1" ]; then
              echo "  retry $${path} (got $${code}, want $${expect})"
              sleep 2
            fi
          done
          local body=$(head -c 200 /tmp/body)
          echo "FAIL $${path} -> $${code} (expected $${expect}) body=$${body}"
          return 1
        }

        fail=0
        # Public endpoints — expect 200
        for path in "/" "/api/health" "/api/proxy/health" "/api/proxy/api/skills/marketplace"; do
          probe "$${path}" "200" "" || fail=1
        done
        # Auth-protected — expect 401 without token (not Next 404 — FE-BRINGUP-1 guard)
        for path in "/api/proxy/api/skills" "/api/proxy/api/auth/whoami"; do
          probe "$${path}" "401" "" || fail=1
        done
        # A browser write carries an Origin header. It must reach auth (401),
        # not be refused by the sidecar's origin check (403): after the ADK
        # 1.39 bump every browser write on test 403'd while GET-only and CLI
        # checks stayed green (2026-10-20).
        code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 -X POST \
          -H "Origin: $${URL}" -H 'Content-Type: application/json' -d '{}' \
          "$${URL}/api/proxy/api/folders") || code=000
        if [ "$${code}" = "401" ]; then
          echo "OK   POST /api/proxy/api/folders (browser Origin, anon) -> 401"
        else
          echo "FAIL POST /api/proxy/api/folders (browser Origin, anon) -> $${code} (expected 401; 403 = origin check) body=$$(head -c 200 /tmp/body)"
          fail=1
        fi
        exit $${fail}

  # --- Platform-skill seed (via sidecar proxy). Idempotent. Fails build on error.
  # Uses the GCE metadata-server identity endpoint — this works under any SA
  # (user-managed or default), unlike `gcloud auth print-identity-token`.
  # include_email=true is required: the backend allowlist check needs the email
  # claim (see docs/ops/gotchas.md #13 #14 and docs/ops/platform-skills.md).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: seed-platform-skills
    waitFor: ['smoke-deployed']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        URL=$(gcloud run services describe ${_SERVICE_NAME} \
          --project=${_PROJECT_ID} --region=${_REGION} \
          --format='value(status.url)')
        TOKEN=$(curl -sf \
          "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=$${URL}&format=full&include_email=true" \
          -H "Metadata-Flavor: Google")
        code=$(curl -sS -o /tmp/seed -w '%{http_code}' --max-time 60 \
          -X POST -H "Authorization: Bearer $${TOKEN}" \
          "$${URL}/api/proxy/api/admin/seed-platform-skills") || code=000
        body=$(head -c 300 /tmp/seed)
        echo "seed-platform-skills -> $${code} body=$${body}"
        if [ "$${code}" != "200" ]; then
          echo "ERROR: seed step returned $${code} — marketplace will be empty" >&2
          exit 1
        fi
        # MCP REGISTRY GATE. The seed already runs `verify_mcp_registry` and
        # returns `mcp_missing` — every entry is a skill that will hard-500 at
        # agent build (G42) the moment a user opens it. Until 2026-09-05 that
        # was only LOGGED, so a deploy reported success and the first person to
        # open the skill got an opaque error instead.
        #
        # That is exactly how prod shipped without `mcp_servers/browser`: the
        # row was hand-written on dev and test and never seeded, the check
        # noticed, wrote an ERROR line nobody reads, and the build went green.
        # Parse failure must FAIL, not pass quietly. `|| echo ""` here would turn
        # a broken python3 or a malformed body into a green gate — an assertion
        # that cannot run reporting success is worse than no assertion, which is
        # the whole reason this gate exists (see the log-only check it replaced).
        if ! missing=$(python3 -c "import json;d=json.load(open('/tmp/seed'));print(','.join(d.get('mcp_missing') or []))"); then
          echo "ERROR: could not read mcp_missing from the seed response — the registry gate did NOT run" >&2
          exit 1
        fi
        if [ -n "$${missing}" ]; then
          echo "ERROR: mcp_servers registry cannot satisfy declared servers: $${missing}" >&2
          echo "  Those skills WILL hard-500 at agent build. Seed the row for this env:" >&2
          echo "    uv run python backend/scripts/seed_mcp_servers.py --env <env> [--browser-url ...]" >&2
          exit 1
        fi

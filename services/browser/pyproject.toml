[project]
name = "platform-browser"
version = "0.1.0"
description = "Isolated browsing service — an MCP gateway over Obscura subprocesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Pinned to match the backend exactly. The backend is the CLIENT of this
    # service, and mcp 2.x is a breaking API change (no list_tools/call_tool
    # decorators on the low-level Server). Straddling two SDK majors across a
    # boundary we own is not worth the churn; bump both together or neither.
    "mcp==1.27.0",
    "psutil>=6.0",
    "google-cloud-firestore>=2.19",
    "opentelemetry-api>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
